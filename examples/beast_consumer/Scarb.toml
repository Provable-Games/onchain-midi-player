[package]
name = "beast_consumer"
version = "0.1.0"
edition = "2025_12"
description = "End-to-end example: a Beasts-style NFT injecting the onchain MIDI player into its token_uri, with library calls to the real class."
license = "Apache-2.0"
publish = false

[dependencies]
onchain_midi_player = { path = "../.." }
# The NFT-owned document/UI fragments (generated by scripts/build_segments.mjs).
owned_assets = { path = "../owned_assets" }
starknet = "2.21.0"
# The example NFT is a standard ERC721 (Voyager, marketplaces). The class itself has no OpenZeppelin
# dependency.
openzeppelin_interfaces = "2.2.0"
openzeppelin_introspection = "4.0.1"
openzeppelin_token = "4.0.1"

[dev-dependencies]
snforge_std = "=0.64.1"
assert_macros = "2.21.0"

[[target.starknet-contract]]
sierra = true
# The class itself, compiled from the root crate, so the tests can declare it (never deploy it).
build-external-contracts = ["onchain_midi_player::contract::TinySynth"]

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Two kinds of test go beyond snforge's default step limit, neither because of the class's encoder:
# the naive-nesting tests (`*_equals_naive_nesting`) base64-encode the whole token JSON with
# their own byte-at-a-time encoder, and `token_uri_4_matches_js_digest` computes the SHA-256 of
# the complete full-size token URI in Cairo.
[tool.snforge]
max_n_steps = 100000000
