[package]
name = "beast_consumer"
version = "0.1.0"
edition = "2025_12"
description = "End-to-end example: a Beasts-style NFT injecting the onchain MIDI player into its token_uri, with library calls to the real class."
license = "Apache-2.0"
publish = false

[dependencies]
onchain_midi_player = { path = "../.." }
starknet = "2.20.1"

[dev-dependencies]
snforge_std = "0.64.0"
assert_macros = "2.20.0"

[[target.starknet-contract]]
sierra = true
# The class itself, compiled from the root crate, so the tests can declare it (never deploy it).
build-external-contracts = ["onchain_midi_player::contract::OnchainTinySynth"]

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Two kinds of test go beyond snforge's default step limit, neither because of the class's encoder:
# the naive-nesting tests (`*_equals_naive_nesting`) base64-encode the whole ~44 KB token JSON with
# their own byte-at-a-time encoder, and `token_uri_4_matches_js_digest` computes the SHA-256 of
# token 4's 144,197-byte token_uri in Cairo.
[tool.snforge]
max_n_steps = 100000000
