[package]
name = "onchain_midi_player"
version = "0.1.0"
edition = "2025_12"
description = "Starknet class library that serves an onchain, offline-playable TinySynth MIDI player for NFTs via library_call."
repository = "https://github.com/Provable-Games/onchain-midi-player"
license = "Apache-2.0"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

# The root package plus types/, the tinysynth_interface package. A Scarb git dependency on this
# repository finds only the root package and the workspace members, so the membership is what lets
# other projects depend on tinysynth_interface alone. Commands run here act on the root package (add
# --workspace for both), commands run in types/ on tinysynth_interface, and both share this
# directory's Scarb.lock and target/. The examples are separate packages with their own lockfiles.
[workspace]
members = ["types"]

[dependencies]
starknet = "2.21.0"
# The sound types, the interfaces and `settings::validate`: the workspace member in types/, which
# depends on nothing but starknet. src/types.cairo, src/interface.cairo and src/settings.cairo
# re-export it at this crate's old paths.
tinysynth_interface = { path = "types" }
# The base64 encoder (src/base64.cairo re-exports it): `packages/encoding` of game-components, at
# the release tag v3.1.0. Scarb.lock records the commit it resolves to,
# 66ce934e750f8162de4f6a377357b2b8f8e5c4c0, and CI fails if a build changes the lockfile.
game_components_encoding = { git = "https://github.com/Provable-Games/game-components", tag = "v3.1.0" }

[dev-dependencies]
snforge_std = "=0.64.1"
assert_macros = "2.21.0"
# The Beast reference NFT's document/UI fragments, for the reference assemblies in tests/. A
# dev-dependency: the class never contains them, and packages that depend on this one don't resolve it.
owned_assets = { path = "examples/owned_assets" }

[lib]

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# Above snforge's default step limit: the largest valid SETTINGS without custom waves (175 timbres
# of 8 operators, every field at its type's extreme and every operator filtered: 218,264 bytes)
# takes about 22M steps through `midi_segment`, and 34M with its SHA-256 check; `case_every_slot`'s
# digest test takes about 15M (measured with --tracked-resource cairo-steps). SETTINGS has no byte
# cap: the network prices it.
[tool.snforge]
max_n_steps = 100000000

# Visit https://foundry-rs.github.io/starknet-foundry/appendix/scarb-toml.html for more information

# [tool.snforge]
# exit_first = true
# fuzzer_runs = 256
# tracked_resource = "sierra-gas"

# [profile.dev.cairo]                                        # Needed for `snforge test --coverage`
# unstable-add-statements-code-locations-debug-info = true
# unstable-add-statements-functions-debug-info = true
# inlining-strategy = "avoid"
