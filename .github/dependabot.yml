version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # The tools CI installs (TypeScript, @types/node, playwright-core). A
  # playwright-core update also changes the browser cache key in ci.yml.
  - package-ecosystem: npm
    directory: /.github/ci-tools
    schedule:
      interval: monthly
    groups:
      ci-tools:
        patterns: ["*"]

  # The Codex CLI pin used by the AI-review workflows, a separate package.
  - package-ecosystem: npm
    directory: /.github/scripts/codex-cli
    schedule:
      interval: monthly
    groups:
      codex-cli:
        patterns: ["*"]

  # Root devDependencies are deliberately pinned. Terser/fflate changes affect
  # embedded segment bytes and require a new VERSION, recorded with
  # npm run gen:segments -- --record; fflate also needs a re-derived, re-pinned
  # shared gunzip loader. Update these dependencies deliberately, not through
  # Dependabot. SEGMENT_FORMAT changes only when the shared fragment format does.
