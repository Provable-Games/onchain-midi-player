version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # The tools CI installs (TypeScript, @types/node, playwright-core). A
  # playwright-core update also changes the browser cache key in ci.yml.
  - package-ecosystem: npm
    directory: /.github/ci-tools
    schedule:
      interval: monthly
    groups:
      ci-tools:
        patterns: ["*"]

  # The Codex CLI pin used by the AI-review workflows, a separate package.
  - package-ecosystem: npm
    directory: /.github/scripts/codex-cli
    schedule:
      interval: monthly
    groups:
      codex-cli:
        patterns: ["*"]

  # The root package.json has two devDependencies, Terser and fflate, pinned
  # exactly: their versions determine the bytes of the page the class embeds,
  # so they change only deliberately (npm run gen:page, then a new
  # PAGE_VERSION; for fflate also a re-derived, re-pinned gunzip shim), not
  # through Dependabot.
