# Claude review. The required check is the "Claude review gate" job.
# Model and effort come only from the Actions variables CLAUDE_REVIEW_MODEL and
# CLAUDE_REVIEW_EFFORT. The pinned base action below fixes the Claude Code version.
# Setup and trust boundary rules: .github/scripts/README.md.
name: Claude Review

on:
  pull_request:
    # edited: only a base change re-runs the review (see the guards below).
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

# A title or body edit joins its own group, so it never cancels a review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata' || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Reports only whether the secret is set. Any job that references a secret
  # masks its value, line by line for a multi-line secret such as auth.json, and
  # GitHub drops a job output that contains a masked string (for example "{"
  # inside the matrix JSON). So the setup job never references the secret, and
  # this job's only output is "true" or "false". If it fails or its output is
  # dropped, setup fails, and so does the gate.
  credential:
    name: Claude review credential check
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Check whether the secret is set
        id: check
        env:
          PRESENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "present=$PRESENT" >> "$GITHUB_OUTPUT"

  prepare:
    name: Claude review setup
    needs: credential
    # A title or body edit (no base change) starts nothing.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      policy: ${{ steps.policy.outputs.policy }}
      matrix: ${{ steps.policy.outputs.matrix }}
      merge_base: ${{ steps.policy.outputs.merge_base }}
      missing: ${{ steps.policy.outputs.missing }}
      config_sha: ${{ steps.trust.outputs.config_sha }}
    steps:
      - name: Check out the pull request head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: src

      - name: Choose the trusted review configuration
        id: trust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # begin trusted-config-selection
          set -euo pipefail
          if ! git -C src cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C src fetch --no-tags --quiet origin "$BASE_SHA"
          fi
          git -C src cat-file -e "$BASE_SHA^{commit}"
          if git -C src cat-file -e "$BASE_SHA:.github/review-agents.json" 2>/dev/null; then
            config_sha="$BASE_SHA"
          else
            echo "::error title=AI review configuration::Base branch '$BASE_REF' ($BASE_SHA) has no .github/review-agents.json. Land the review configuration on '$BASE_REF' first."
            exit 1
          fi
          echo "config_sha=$config_sha" >> "$GITHUB_OUTPUT"
          # end trusted-config-selection

      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.trust.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide the review policy and scope
        id: policy
        env:
          CONFIG_SHA: ${{ steps.trust.outputs.config_sha }}
          # Only whether the secret is set reaches this job (see the credential
          # job), never its value. When the secret or a variable is unset, the
          # review is skipped (policy "unconfigured") and the gate passes with a
          # warning.
          REVIEW_SECRET_PRESENT: ${{ needs.credential.outputs.present }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py prepare --config-root trusted --provider claude
          --repo-dir src --event "$GITHUB_EVENT_PATH" --config-sha "$CONFIG_SHA" --bootstrap false

      # Dependency sources for the reviewer, which has no network access (see
      # .github/scripts/README.md, "Static review and dependency sources"). This
      # job holds no secret, nothing here builds or loads a procedural macro, and
      # a failure or timeout only leaves the review without the sources, which
      # its prompt then says.
      - name: Install the pinned Scarb
        id: scarb
        if: steps.policy.outputs.policy == 'review'
        continue-on-error: true
        timeout-minutes: 3
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1.6.2
        with:
          tool-versions: src/.tool-versions
          cache: false

      - name: Fetch the Scarb dependency sources
        id: deps
        if: steps.scarb.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # begin scarb-dependency-sources
          set -euo pipefail
          warn() { echo "::warning title=AI review dependency sources::$1 The review runs without dependency sources."; exit 1; }
          out="$RUNNER_TEMP/deps"
          work="$RUNNER_TEMP/deps-work"
          export SCARB_CACHE="$RUNNER_TEMP/scarb-cache" SCARB_CONFIG="$RUNNER_TEMP/scarb-config"
          rm -rf "$out" "$work" "$SCARB_CACHE" "$SCARB_CONFIG"
          mkdir -p "$out" "$work/head" "$SCARB_CONFIG"
          : > "$out/SOURCES.txt"
          : > "$work/packages.tsv"
          # Fetch in a copy of the head: Scarb may rewrite a lockfile, and src/
          # must stay exactly the reviewed revision.
          git -C src archive --format=tar HEAD | tar -x -C "$work/head"
          for package in . examples/beast_consumer; do
            dir="$work/head/$package"
            [ -f "$dir/Scarb.toml" ] || continue
            [ -f "$dir/Scarb.lock" ] || warn "$package has no committed Scarb.lock."
            cp "$dir/Scarb.lock" "$work/committed.lock"
            # fetch only downloads, nothing is built, and --no-proc-macros keeps
            # Scarb from loading any procedural macro or plugin.
            timeout 120 scarb --no-proc-macros --manifest-path "$dir/Scarb.toml" fetch
            timeout 30 scarb --offline --no-proc-macros --manifest-path "$dir/Scarb.toml" \
              metadata --format-version 1 > "$work/metadata.json"
            cmp -s "$work/committed.lock" "$dir/Scarb.lock" ||
              warn "$package/Scarb.lock does not match its Scarb.toml (Scarb changed it)."
            jq -r '.packages[] | select((.source // "") | startswith("git+") or startswith("registry+"))
              | [.name, .version, .source, .root] | @tsv' "$work/metadata.json" >> "$work/packages.tsv"
          done
          while IFS=$'\t' read -r name version source root; do
            if [[ "$source" == git+* ]]; then
              rev="${source##*#}"
              top="$(git -C "$root" rev-parse --show-toplevel)"
              [[ "$rev" =~ ^[0-9a-f]{40}$ && "$(git -C "$top" rev-parse HEAD)" == "$rev" ]] ||
                warn "$name is not checked out at its locked commit ($source)."
            else
              rev="$version"
              top="$root"
            fi
            [[ "$name" =~ ^[a-z_][a-z0-9_]{0,63}$ && "$rev" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]] ||
              warn "Unexpected package name or revision: $name $rev."
            printf '%s\t%s\n' "$name@$rev${root#"$top"}" "$source" >> "$out/SOURCES.txt"
            [ -e "$out/$name@$rev" ] && continue
            mkdir "$out/$name@$rev"
            # Sources only: no .git, and no target/ (prebuilt plugin binaries).
            tar -C "$top" --exclude=./.git --exclude=./target -cf - . | tar -C "$out/$name@$rev" -xf -
          done < <(LC_ALL=C sort -u "$work/packages.tsv")
          # Keep only regular files and directories: a link could point outside.
          find "$out" ! -type f ! -type d -delete
          cat "$out/SOURCES.txt"
          # end scarb-dependency-sources

      - name: Upload the dependency sources
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Must not match the claude-review-* pattern that publish and gate read results from.
          name: claude-dependency-sources
          path: ${{ runner.temp }}/deps
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  review:
    name: Claude review / ${{ matrix.agent_id }}
    needs: prepare
    # Credentials are used only for same-repository, non-draft pull requests.
    if: >-
      needs.prepare.outputs.policy == 'review'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the trusted review configuration
        id: trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Fingerprint the trusted configuration
        id: fingerprint
        run: |
          # begin trusted-fingerprint
          set -euo pipefail
          digest="$(cd trusted && find .github -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          # end trusted-fingerprint
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head as data
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: src

      - name: Validate the central model and effort settings
        id: settings
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
        run: python3 -I -B trusted/.github/scripts/review.py config --config-root trusted --provider claude

      - name: Check the review credential
        id: credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=AI review configuration::The CLAUDE_CODE_OAUTH_TOKEN secret is not available to this workflow run."
            exit 1
          fi

      # Optional context from the setup job. Without it, the prompt says that
      # the dependency sources are unavailable.
      - name: Download the dependency sources
        id: deps
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: claude-dependency-sources
          path: ${{ runner.temp }}/deps

      - name: Make the dependency sources read-only
        env:
          DOWNLOAD: ${{ steps.deps.outcome }}
        run: |
          # begin dependency-sources-read-only
          set -euo pipefail
          deps="$RUNNER_TEMP/deps"
          if [ "$DOWNLOAD" != success ]; then
            rm -rf "$deps"
            echo "::warning title=AI review dependency sources::This review has no dependency sources (download $DOWNLOAD); see the setup job's log."
            exit 0
          fi
          find "$deps" ! -type f ! -type d -delete
          chmod -R a-w "$deps"
          # end dependency-sources-read-only

      - name: Build the review prompt
        id: prompt
        env:
          REVIEW_DEPS_DIR: ${{ runner.temp }}/deps
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          AGENT_ID: ${{ matrix.agent_id }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py prompt --config-root trusted --provider claude
          --repo-dir src --event "$GITHUB_EVENT_PATH" --agent-id "$AGENT_ID"
          --out-dir "$RUNNER_TEMP/review" --config-sha "$CONFIG_SHA" --bootstrap false

      # The action changes into CLAUDE_WORKING_DIR and runs Bun there, and Bun
      # loads bunfig.toml (preloads) and .env files from that directory. It must
      # therefore be a trusted empty directory, never the pull request checkout.
      - name: Prepare an empty working directory for Claude
        id: workdir
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/claude-cwd"
          mkdir -p "$dir"
          if [ -n "$(ls -A "$dir")" ]; then
            echo "::error title=AI review integrity::$dir is not empty."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "config_dir=$HOME/.claude" >> "$GITHUB_OUTPUT"

      - name: Build the Claude arguments
        id: args
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
          CONTEXT_DIR: ${{ steps.prompt.outputs.context_dir }}
        run: |
          set -euo pipefail
          dirs=(--add-dir "$GITHUB_WORKSPACE/src" --add-dir "$CONTEXT_DIR")
          if [ -d "$RUNNER_TEMP/deps" ]; then dirs+=(--add-dir "$RUNNER_TEMP/deps"); fi
          python3 -I -B trusted/.github/scripts/review.py claude-args --config-root trusted "${dirs[@]}"

      # The base action runs Claude Code without GitHub tools or a GitHub token.
      # Its SHA fixes the Claude Code version it installs (2.1.288 for v1.0.240).
      # The environment below presets every variable that could redirect the
      # model, effort, configuration, proxy or runtime to trusted values.
      - name: Run the Claude review
        id: claude
        uses: anthropics/claude-code-action/base-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env:
          CLAUDE_WORKING_DIR: ${{ steps.workdir.outputs.dir }}
          ANTHROPIC_MODEL: ${{ steps.settings.outputs.model }}
          CLAUDE_CODE_EFFORT_LEVEL: ""
          CLAUDE_CONFIG_DIR: ${{ steps.workdir.outputs.config_dir }}
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD: "0"
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          NODE_OPTIONS: ""
          NODE_EXTRA_CA_CERTS: ""
          BUN_OPTIONS: ""
          BUN_CONFIG_REGISTRY: ""
          BUN_CONFIG_TOKEN: ""
        with:
          prompt_file: ${{ steps.prompt.outputs.prompt_file }}
          claude_args: ${{ steps.args.outputs.claude_args }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Verify the trusted configuration
        id: verify
        if: ${{ !cancelled() && steps.fingerprint.outcome == 'success' }}
        env:
          EXPECTED_DIGEST: ${{ steps.fingerprint.outputs.digest }}
        run: |
          # begin trusted-fingerprint
          set -euo pipefail
          digest="$(cd trusted && find .github -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          # end trusted-fingerprint
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error title=AI review integrity::The trusted review configuration changed during the review run."
            exit 1
          fi

      - name: Record the review result
        id: result
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
          CLAUDE_REVIEW_EFFORT: ${{ vars.CLAUDE_REVIEW_EFFORT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CONFIG_SHA: ${{ needs.prepare.outputs.config_sha }}
          MERGE_BASE: ${{ needs.prepare.outputs.merge_base }}
          AGENT_ID: ${{ matrix.agent_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          WORKDIR: ${{ steps.workdir.outputs.dir }}
          OUTCOMES: >-
            checkout=${{ steps.source.outcome }}
            settings=${{ steps.settings.outcome }}
            credential=${{ steps.credential.outcome }}
            prompt=${{ steps.prompt.outcome }}
            workdir=${{ steps.workdir.outcome }}
            arguments=${{ steps.args.outcome }}
        run: |
          set -euo pipefail
          steps=()
          for outcome in $OUTCOMES; do steps+=(--step "$outcome"); done
          python3 -I -B trusted/.github/scripts/review.py result --config-root trusted --provider claude \
            --event "$GITHUB_EVENT_PATH" --agent-id "$AGENT_ID" --out-dir "$RUNNER_TEMP/review/out" \
            --config-sha "$CONFIG_SHA" --bootstrap false --merge-base "$MERGE_BASE" --run-url "$RUN_URL" \
            --execution-file "$EXECUTION_FILE" --action-outcome "$ACTION_OUTCOME" --conclusion "$CONCLUSION" \
            --expected-execution-file "$RUNNER_TEMP/claude-execution-output.json" --session-id "$SESSION_ID" \
            --expected-cwd "$WORKDIR" "${steps[@]}"

      - name: Upload the review result
        if: ${{ !cancelled() && steps.result.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ matrix.agent_id }}
          path: |
            ${{ runner.temp }}/review/out/result.json
            ${{ runner.temp }}/review/out/review.md
          if-no-files-found: error
          retention-days: 1

      - name: Require a completed review
        if: ${{ !cancelled() }}
        run: |
          result="$RUNNER_TEMP/review/out/result.json"
          if ! jq -e '.status == "complete"' "$result" >/dev/null 2>&1; then
            echo "::error title=AI review::The review did not complete: $(jq -r '(.status // "missing") + ": " + ((.errors // []) | join("; "))' "$result" 2>/dev/null || echo 'no result was recorded')"
            exit 1
          fi

  publish:
    name: Claude review comment
    needs: [prepare, review]
    if: >-
      !cancelled() && needs.prepare.outputs.policy == 'review'
      && (needs.review.result == 'success' || needs.review.result == 'failure')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the review results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claude-review-*
          path: ${{ runner.temp }}/results

      - name: Publish the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py publish --config-root trusted --provider claude
          --event "$GITHUB_EVENT_PATH" --results-dir "$RUNNER_TEMP/results" --matrix "$MATRIX"
          --review-job-result "$REVIEW_RESULT"

  gate:
    # A title or body edit gets a different check name, so its skipped job can
    # never stand in for the required "Claude review gate" of a real run.
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'Claude review gate (title or body edit, not evaluated)' || 'Claude review gate' }}
    needs: [prepare, review, publish]
    if: ${{ always() && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require review setup
        if: needs.prepare.result != 'success'
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: |
          echo "::error title=AI review gate::Claude review setup did not succeed ($PREPARE_RESULT)."
          exit 1

      - name: Check out the trusted review configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.config_sha }}
          persist-credentials: false
          path: trusted
          sparse-checkout: |
            .github/review-agents.json
            .github/prompts
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the review results
        if: needs.prepare.outputs.policy == 'review'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claude-review-*
          path: ${{ runner.temp }}/results

      - name: Evaluate the gate
        env:
          POLICY: ${{ needs.prepare.outputs.policy }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          MISSING: ${{ needs.prepare.outputs.missing }}
        run: >-
          python3 -I -B trusted/.github/scripts/review.py gate --config-root trusted --provider claude
          --event "$GITHUB_EVENT_PATH" --results-dir "$RUNNER_TEMP/results" --policy "$POLICY"
          --matrix "$MATRIX" --prepare-result "$PREPARE_RESULT" --review-result "$REVIEW_RESULT"
          --publish-result "$PUBLISH_RESULT" --missing "$MISSING"
