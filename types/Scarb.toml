[package]
name = "tinysynth_interface"
version = "0.1.1"
edition = "2025_12"
description = "The TinySynth sound types and interfaces of onchain-midi-player (TinySynthSound, TinySynthSettings, ISoundProvider, ITinySynth, settings::validate), with no dependency but starknet."
repository = "https://github.com/Provable-Games/onchain-midi-player"
license = "Apache-2.0"

# Nothing but `starknet`, and no dev-dependencies: a package that depends on this one resolves no
# other package through it. A member of the repository's root workspace, which is how a git
# dependency on the repository finds it (Scarb.lock and target/ are the root's). The root package
# `onchain_midi_player` (the TinySynth class) depends on it by path and re-exports it at its old
# paths; its tests cover `settings::validate`.
[dependencies]
starknet = "2.20.1"

[lib]
